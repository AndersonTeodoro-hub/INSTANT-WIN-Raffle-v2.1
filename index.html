<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>INSTANT WIN | Arbitrum</title>
    <meta name="description" content="Decentralized Raffle on Arbitrum One">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind via CDN apenas para fallback, o Vite processa o CSS real -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              brand: {
                DEFAULT: '#F59E0B', // Amber 500 (Gold)
                glow: 'rgba(245, 158, 11, 0.3)',
              },
              action: {
                DEFAULT: '#2563EB', // Blue 600
                hover: '#1d4ed8',
              },
              success: {
                DEFAULT: '#22C55E', // Green 500
                hover: '#16a34a',
              },
              dark: {
                bg: '#000000',     // Pure Black
                card: '#0F0F11',   // Dark Gray Card
                border: '#1E1E22', // Subtle Border
                input: '#18181B',  // Input Background
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out',
              'shimmer': 'shimmer 2s infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              shimmer: {
                '100%': { transform: 'translateX(100%)' },
              }
            }
          },
        },
      }
    </script>
