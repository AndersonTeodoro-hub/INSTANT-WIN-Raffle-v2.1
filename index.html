<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale / user-scalable=no removidos: bloqueavam o zoom por pinça,
         que é um requisito de acessibilidade em mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keptra — Provably fair events</title>
    <meta name="description" content="Keptra runs provably fair draws on Arbitrum One: the Instant Win lottery, Giveaways and the Event Center. Every winner is drawn by Chainlink VRF and every prize is claimed straight from the contract.">

    <!-- Open Graph. Os scrapers não correm JavaScript: todas as rotas pré-visualizam
         com estas etiquetas, por isso og:url é a página inicial (as campanhas têm as
         suas, api/og/event.ts, que repete estas etiqueta a etiqueta). O URL canónico
         de cada rota põe-no App.tsx. A imagem: a placa de aço escovado da marca. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Keptra">
    <meta property="og:url" content="https://keptra.io/">
    <meta property="og:title" content="Keptra — Provably fair events">
    <meta property="og:description" content="The Instant Win lottery, Giveaways and the Event Center on Arbitrum One. Every winner drawn by Chainlink VRF, every prize claimed from the contract.">
    <meta property="og:image" content="https://keptra.io/og-image-keptra.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Keptra, engraved in a brushed steel plate beside a rosette drawn from its seed, above the line promises, kept.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://keptra.io/og-image-keptra.png">

    <!-- O K do escrow: SVG que segue o tema do browser (preto no claro, branco no
         escuro); o PNG para quem não lê SVG e para o ecrã inicial. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0A0A0B">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Identidade "Proof, Not Promise": Big Shoulders nas manchetes,
         IBM Plex Mono em todos os dados, Inter no corpo de texto. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
